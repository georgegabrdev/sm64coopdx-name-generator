<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SM64CoopDX Name Generator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
        :root {
            --bg-color: #1a1a24;
            --card-bg: #242436;
            --accent: #4e73df;
            --accent-hover: #375a7f;
            --text-light: #f8f9fc;
            --text-muted: #a0a5ba;
            --border: #383852;
            --success-green: #2ecc71;
            --danger-red: #e74c3c;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 24px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-light);
            text-align: center;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .color-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .color-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #181824;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .color-item input[type="text"] {
            background: #0f0f17;
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 6px 10px;
            border-radius: 6px;
            width: 120px;
        }

        .swatch-trigger {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            padding: 0;
            background: transparent;
        }

        .swatch-inner {
            width: 100%;
            height: 100%;
            border-radius: 5px;
        }

        .tag-preview {
            color: var(--accent);
            flex-grow: 1;
        }

        .btn-add {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: #219150;
        }

        .btn-remove {
            background: transparent;
            color: var(--danger-red);
            border: 1px solid var(--danger-red);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-remove:hover {
            background: var(--danger-red);
            color: white;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: #14141d;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-light);
            padding: 12px;
            font-size: 1rem;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea:focus {
            outline: 2px solid var(--accent);
            border-color: transparent;
        }

        .output-box textarea {
            background-color: #0f0f17;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .status-message {
            color: var(--success-green);
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 10px;
            height: 20px;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .status-message.visible {
            opacity: 1;
        }

        .note {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 12px;
            line-height: 1.4;
        }

        code {
            background: #14141d;
            padding: 2px 6px;
            border-radius: 4px;
            color: #e74c3c;
        }

        .color-item input[type="text"],
        .tag-preview,
        .output-box textarea,
        .inputs-row input,
        code {
            font-family: 'JetBrains Mono', monospace;
        }

        /* --- CUSTOM PICKER WINDOW STYLES --- */
        #picker {
            position: fixed;
            z-index: 9999;
            background: #20202e;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 240px;
            padding: 10px;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        #picker.open {
            opacity: 1;
            transform: scale(1);
        }

        #titlebar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            user-select: none;
        }

        #closeBtn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 150px;
        }

        #canvas {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            cursor: crosshair;
        }

        #dot {
            position: absolute;
            width: 12px;
            height: 12px;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        .slider-group {
            margin: 10px 0;
        }

        #hue {
            width: 100%;
            -webkit-appearance: none;
            height: 10px;
            border-radius: 5px;
            background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
            outline: none;
        }

        .inputs-row {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            align-items: center;
        }

        .inputs-row input {
            background: #14141d;
            border: 1px solid var(--border);
            color: #fff;
            padding: 4px;
            border-radius: 4px;
            text-align: center;
        }

        #hex { width: 70px; }
        .rgb-input { width: 35px; }

        #preview {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .picker-actions {
            display: flex;
            gap: 8px;
        }

        .picker-actions button {
            flex: 1;
            padding: 6px;
            border-radius: 4px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        * {
            font-family: 'Roboto', sans-serif !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SM64CoopDX Name Generator</h1>

    <div class="section-title">Color Tags:</div>
    <div id="colorList" class="color-list"></div>
    <button class="btn-add" onclick="addColorTag()">+ Add New Color Tag</button>

    <div class="control-group">
        <label for="inputText">Input Text (Use tags like <code>&lt;color1&gt;</code> or <code>&lt;star&gt;</code>):</label>
        <textarea id="inputText" placeholder="Type here... e.g. <color1>Red text <color2>Blue text <star>"></textarea>
    </div>

    <div class="control-group output-box">
        <label for="outputText">Formatted Output (SM64CoopDX):</label>
        <textarea id="outputText" readonly placeholder="Output will appear here..."></textarea>
        <button class="btn" onclick="copyOutput()">Copy to Clipboard</button>
        <div id="statusMessage" class="status-message">Copied to clipboard!</div>
    </div>

    <p class="note">
        <strong>Tips:</strong>
        <br>• Use <code>&lt;star&gt;</code> for code point <code>U+007F</code>.
        <br>• Custom tags get replaced with <code>\#HEX\</code> in-game color codes.
    </p>
</div>

<div id="picker" hidden>
    <div id="titlebar">
        <span>Color Picker</span>
        <button id="closeBtn">✕</button>
    </div>
    <div class="canvas-container">
        <canvas id="canvas" width="200" height="150"></canvas>
        <div id="dot"></div>
    </div>
    <div class="slider-group">
        <input type="range" id="hue" min="0" max="360" value="0">
    </div>
    <div class="inputs-row">
        <div id="preview"></div>
        <input type="text" id="hex" readonly>
        <input type="text" id="r" class="rgb-input" readonly>
        <input type="text" id="g" class="rgb-input" readonly>
        <input type="text" id="b" class="rgb-input" readonly>
    </div>
    <div class="picker-actions">
        <button id="okBtn">OK</button>
        <button id="cancelBtn">Cancel</button>
    </div>
</div>

<script>
    // System Elements
    const colorListContainer = document.getElementById('colorList');
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const statusMessage = document.getElementById('statusMessage');

    const STAR_CHAR = String.fromCodePoint(0x007F);
    let hideMessageTimeout = null;
    let tagCounter = 1;
    let currentActiveItem = null;

    // Picker DOM Elements
    const picker = document.getElementById("picker");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const dot = document.getElementById("dot");
    const hueSlider = document.getElementById("hue");
    const hexInput = document.getElementById("hex");
    const rInput = document.getElementById("r");
    const gInput = document.getElementById("g");
    const bInput = document.getElementById("b");
    const preview = document.getElementById("preview");
    const okBtn = document.getElementById("okBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const titlebar = document.getElementById("titlebar");
    const closeBtn = document.getElementById("closeBtn");

    let currentTrigger = null;
    let currentSwatch = null;

    let state = { hue: 0, s: 0.5, l: 0.5, dragging: false };
    let lastConfirmed = { hue: 0, s: 0.5, l: 0.5 };

    // --- Color Math ---
    function hsvToRgb(h, s, v) {
        h /= 360;
        let r, g, b;
        const i = Math.floor(h * 6);
        const f = h * 6 - i;
        const p = v * (1 - s);
        const q = v * (1 - f * s);
        const t = v * (1 - (1 - f) * s);

        switch (i % 6) {
            case 0: r = v; g = t; b = p; break;
            case 1: r = q; g = v; b = p; break;
            case 2: r = p; g = v; b = t; break;
            case 3: r = p; g = q; b = v; break;
            case 4: r = t; g = p; b = v; break;
            case 5: r = v; g = p; b = q; break;
        }

        return {
            r: Math.round(r * 255),
            g: Math.round(g * 255),
            b: Math.round(b * 255)
        };
    }

    function hexToHsv(hex) {
        hex = hex.replace(/^#/, '');
        if (hex.length === 3) hex = hex.split('').map(x => x + x).join('');
        let r = parseInt(hex.substring(0, 2), 16) / 255;
        let g = parseInt(hex.substring(2, 4), 16) / 255;
        let b = parseInt(hex.substring(4, 6), 16) / 255;

        let max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, v = max;
        let d = max - min;
        s = max === 0 ? 0 : d / max;

        if (max === min) {
            h = 0;
        } else {
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }

        return { hue: h * 360, s: s, l: v };
    }

    function rgbToHex(r, g, b) {
        return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("").toUpperCase();
    }

    // --- Rendering Picker ---
    function draw() {
        const img = ctx.createImageData(canvas.width, canvas.height);
        for (let y = 0; y < canvas.height; y++) {
            for (let x = 0; x < canvas.width; x++) {
                const s = x / canvas.width;
                const v = 1 - (y / canvas.height);
                const rgb = hsvToRgb(state.hue, s, v);
                const i = (y * canvas.width + x) * 4;
                img.data[i] = rgb.r;
                img.data[i + 1] = rgb.g;
                img.data[i + 2] = rgb.b;
                img.data[i + 3] = 255;
            }
        }
        ctx.putImageData(img, 0, 0);
    }

    function updateInputs(rgb) {
        const hex = rgbToHex(rgb.r, rgb.g, rgb.b);
        hexInput.value = hex;
        rInput.value = rgb.r;
        gInput.value = rgb.g;
        bInput.value = rgb.b;

        preview.style.background = hex;
        if (currentSwatch) {
            currentSwatch.style.background = hex;
        }
        if (currentActiveItem) {
            currentActiveItem.dataset.colorHex = hex;
            currentActiveItem.querySelector('.tag-preview').textContent = `#${hex.replace('#', '')}`;
            updateOutput();
        }
    }

    function updateDot(x, y) {
        const scaleX = canvas.offsetWidth / canvas.width;
        const scaleY = canvas.offsetHeight / canvas.height;
        dot.style.left = (canvas.offsetLeft + x * scaleX) + "px";
        dot.style.top = (canvas.offsetTop + y * scaleY) + "px";
    }

    function syncDotToState() {
        updateDot(state.s * canvas.width, (1 - state.l) * canvas.height);
    }

    function pick(x, y) {
        state.s = x / canvas.width;
        state.l = 1 - (y / canvas.height);
        const rgb = hsvToRgb(state.hue, state.s, state.l);
        updateInputs(rgb);
        updateDot(x, y);
    }

    function handleMouseEvent(e) {
        const rect = canvas.getBoundingClientRect();
        let x = ((e.clientX - rect.left) / rect.width) * canvas.width;
        let y = ((e.clientY - rect.top) / rect.height) * canvas.height;
        x = Math.max(0, Math.min(canvas.width, x));
        y = Math.max(0, Math.min(canvas.height, y));
        pick(x, y);
    }

    // --- Window Dragging ---
    let isDraggingWindow = false;
    let dragOffsetX = 0, dragOffsetY = 0;
    let userMoved = false;

    function startWindowDrag(e) {
        isDraggingWindow = true;
        userMoved = true;
        const rect = picker.getBoundingClientRect();
        dragOffsetX = e.clientX - rect.left;
        dragOffsetY = e.clientY - rect.top;
        e.preventDefault();
    }

    function onWindowDragMove(e) {
        if (!isDraggingWindow) return;
        let left = e.clientX - dragOffsetX;
        let top = e.clientY - dragOffsetY;
        const maxLeft = window.innerWidth - picker.offsetWidth;
        const maxTop = window.innerHeight - picker.offsetHeight;
        left = Math.max(0, Math.min(maxLeft, left));
        top = Math.max(0, Math.min(maxTop, top));
        picker.style.left = left + "px";
        picker.style.top = top + "px";
    }

    function stopWindowDrag() {
        isDraggingWindow = false;
    }

    titlebar.addEventListener("mousedown", startWindowDrag);
    window.addEventListener("mousemove", onWindowDragMove);
    window.addEventListener("mouseup", stopWindowDrag);

    // --- Open / Close Logic ---
    function positionPicker() {
        if (userMoved || !currentTrigger) return;
        const rect = currentTrigger.getBoundingClientRect();
        picker.style.position = "fixed";
        picker.style.top = (rect.bottom + 8) + "px";
        picker.style.left = rect.left + "px";
    }

    function openPickerFor(itemElement, triggerBtn, swatchEl) {
        currentActiveItem = itemElement;
        currentTrigger = triggerBtn;
        currentSwatch = swatchEl;

        const hsv = hexToHsv(itemElement.dataset.colorHex || "#FF0000");
        state.hue = hsv.hue;
        state.s = hsv.s;
        state.l = hsv.l;
        hueSlider.value = state.hue;

        lastConfirmed = { hue: state.hue, s: state.s, l: state.l };

        picker.hidden = false;
        userMoved = false;
        positionPicker();
        draw();
        syncDotToState();
        updateInputs(hsvToRgb(state.hue, state.s, state.l));

        requestAnimationFrame(() => picker.classList.add("open"));

        document.addEventListener("mousedown", handleOutsideClick, true);
        document.addEventListener("keydown", handleKeydown, true);
        window.addEventListener("resize", positionPicker);
        window.addEventListener("scroll", positionPicker, true);
    }

    function closePicker() {
        if (picker.hasAttribute("hidden")) return;
        picker.classList.remove("open");

        document.removeEventListener("mousedown", handleOutsideClick, true);
        document.removeEventListener("keydown", handleKeydown, true);
        window.removeEventListener("resize", positionPicker);
        window.removeEventListener("scroll", positionPicker, true);

        const onEnd = () => {
            picker.hidden = true;
            picker.removeEventListener("transitionend", onEnd);
        };
        picker.addEventListener("transitionend", onEnd);
    }

    function handleOutsideClick(e) {
        if (picker.contains(e.target) || (currentTrigger && currentTrigger.contains(e.target))) return;
        closePicker();
    }

    function handleKeydown(e) {
        if (e.key === "Escape") {
            applyState(lastConfirmed);
            closePicker();
        } else if (e.key === "Enter") {
            confirmAndClose();
        }
    }

    function applyState(s) {
        state.hue = s.hue;
        state.s = s.s;
        state.l = s.l;
        hueSlider.value = state.hue;
        draw();
        const rgb = hsvToRgb(state.hue, state.s, state.l);
        updateInputs(rgb);
        syncDotToState();
    }

    function confirmAndClose() {
        lastConfirmed = { hue: state.hue, s: state.s, l: state.l };
        closePicker();
    }

    function cancelAndClose() {
        applyState(lastConfirmed);
        closePicker();
    }

    // Picker Wiring
    canvas.addEventListener("mousedown", e => {
        state.dragging = true;
        handleMouseEvent(e);
    });

    window.addEventListener("mousemove", e => {
        if (!state.dragging) return;
        handleMouseEvent(e);
    });

    window.addEventListener("mouseup", () => {
        state.dragging = false;
    });

    hueSlider.addEventListener("input", e => {
        state.hue = +e.target.value;
        draw();
        const rgb = hsvToRgb(state.hue, state.s, state.l);
        updateInputs(rgb);
    });

    okBtn.addEventListener("click", confirmAndClose);
    cancelBtn.addEventListener("click", cancelAndClose);
    closeBtn.addEventListener("click", cancelAndClose);

    // --- Color Tag Management ---
    function createColorItem(tagName, colorVal, isRemovable = true) {
        const item = document.createElement('div');
        item.className = 'color-item';
        item.dataset.colorHex = colorVal.toUpperCase();

        item.innerHTML = `
            <span>&lt;</span>
            <input type="text" class="tag-name-input" value="${tagName}" placeholder="tag name">
            <span>&gt;</span>
            <button class="swatch-trigger" type="button">
                <div class="swatch-inner" style="background: ${colorVal};"></div>
            </button>
            <span class="tag-preview">#${colorVal.replace('#', '').toUpperCase()}</span>
            ${isRemovable ? `<button class="btn-remove" onclick="removeColorTag(this)">✕</button>` : ''}
        `;

        const nameInput = item.querySelector('.tag-name-input');
        const triggerBtn = item.querySelector('.swatch-trigger');
        const swatchInner = item.querySelector('.swatch-inner');

        nameInput.addEventListener('input', updateOutput);
        triggerBtn.addEventListener('click', () => {
            openPickerFor(item, triggerBtn, swatchInner);
        });

        colorListContainer.appendChild(item);
    }

    function addColorTag() {
        tagCounter++;
        while (document.querySelector(`.tag-name-input[value="color${tagCounter}"]`)) {
            tagCounter++;
        }
        createColorItem(`color${tagCounter}`, '#FFFFFF', true);
        updateOutput();
    }

    function removeColorTag(button) {
        const item = button.parentElement;
        if (currentActiveItem === item) closePicker();
        item.remove();
        updateOutput();
    }

    function updateOutput() {
        let rawText = inputText.value;

        if (rawText.trim() === '') {
            outputText.value = '';
            return;
        }

        let processedText = rawText.replace(/<star>/gi, STAR_CHAR);

        const colorItems = document.querySelectorAll('.color-item');
        colorItems.forEach(item => {
            const tagName = item.querySelector('.tag-name-input').value.trim();
            const hexColor = (item.dataset.colorHex || '#FFFFFF').replace('#', '').toUpperCase();

            if (tagName !== '') {
                const escapedTag = tagName.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                const regex = new RegExp(`<${escapedTag}>`, 'gi');
                processedText = processedText.replace(regex, `\\#${hexColor}\\`);
            }
        });

        outputText.value = processedText;
    }

    // Default Initial Tags (color1 set to non-removable with `false`)
    createColorItem('color1', '#FF0000', false);

    inputText.addEventListener('input', updateOutput);

    function copyOutput() {
        if (!outputText.value) return;
        
        outputText.select();
        outputText.setSelectionRange(0, 99999);

        navigator.clipboard.writeText(outputText.value).then(() => {
            showStatusMessage();
        }).catch(err => {
            console.error('Failed to copy: ', err);
        });
    }

    function showStatusMessage() {
        if (hideMessageTimeout) {
            clearTimeout(hideMessageTimeout);
        }

        statusMessage.classList.add('visible');

        hideMessageTimeout = setTimeout(() => {
            statusMessage.classList.remove('visible');
        }, 2500);
    }
</script>

</body>
</html>
